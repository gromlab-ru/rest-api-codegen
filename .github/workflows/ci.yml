name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Rebuild skill deterministically
        run: |
          mv skills/rest-api-codegen-ru "$RUNNER_TEMP/rest-api-codegen-ru-expected"
          npm run build:skills
          diff -qr "$RUNNER_TEMP/rest-api-codegen-ru-expected" skills/rest-api-codegen-ru
          git diff --exit-code -- skills/rest-api-codegen-ru

      - name: Verify skill discovery
        env:
          NO_COLOR: "1"
        run: |
          SKILLS_OUTPUT=$(npx --yes skills@1.5.22 add . --list)
          printf '%s\n' "$SKILLS_OUTPUT"

          case "$SKILLS_OUTPUT" in
            *"Found 1 skill"*"rest-api-codegen-ru"*) ;;
            *) echo "Expected exactly one discoverable rest-api-codegen-ru skill" >&2; exit 1 ;;
          esac

      - name: Build package
        run: npm run build

      - name: Inspect package tarball
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          tar -tzf "$RUNNER_TEMP"/package/*.tgz
